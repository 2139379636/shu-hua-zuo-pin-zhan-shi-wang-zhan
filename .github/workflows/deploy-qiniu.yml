name: 同步到七牛云

  on:
    push:
      branches: [main]                                                          
    workflow_dispatch:

  jobs:
    deploy:
      runs-on: ubuntu-latest
      permissions:
        contents: read

      steps:
        - name: 检出代码
          uses: actions/checkout@v4

        - name: 设置 Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: 安装七牛 SDK
          run: pip install qiniu

        - name: 同步到七牛云
          env:
            QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
            QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
            QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          run: |
            python .github/scripts/sync_to_qiniu.py

        - name: 部署完成
          if: success()
          run: |
            echo "✓ 部署成功，访问七牛云测试域名查看"
